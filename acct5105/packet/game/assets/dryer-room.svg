<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-label="Dorm laundry room with dryers and SLOT credits">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8dcc8"/>
      <stop offset="100%" stop-color="#d4c4ac"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4b49a"/>
      <stop offset="100%" stop-color="#a89478"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f0ea"/>
      <stop offset="55%" stop-color="#d8d0c4"/>
      <stop offset="100%" stop-color="#b8aea0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#wall)"/>
  <rect y="320" width="800" height="160" fill="url(#floor)"/>
  <rect x="0" y="300" width="800" height="22" fill="#8a7355"/>
  <!-- notice board -->
  <rect x="40" y="48" width="160" height="110" rx="6" fill="#fffaf3" stroke="#5c564e" stroke-width="3"/>
  <text x="120" y="78" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#9b1c1c" font-weight="700">FLOOR RULES</text>
  <text x="120" y="102" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5c564e">1 credit = 30 min</text>
  <text x="120" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5c564e">gift / sale / wage</text>
  <text x="120" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#5c564e">freeze if broken dryer</text>
  <!-- sticky mess -->
  <rect x="55" y="175" width="48" height="36" rx="3" fill="#f3e4c4" transform="rotate(-8 79 193)"/>
  <rect x="110" y="180" width="48" height="36" rx="3" fill="#f7e4e0" transform="rotate(6 134 198)"/>
  <rect x="85" y="210" width="48" height="36" rx="3" fill="#d7e8df" transform="rotate(-3 109 228)"/>
  <text x="120" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6a6258">sticky-note chaos</text>
  <!-- dryer 1 -->
  <g transform="translate(250,70)">
    <rect width="150" height="230" rx="12" fill="url(#metal)" stroke="#5c564e" stroke-width="3"/>
    <circle cx="75" cy="115" r="58" fill="#2a2622" stroke="#8a8074" stroke-width="8"/>
    <circle cx="75" cy="115" r="42" fill="#3d3832"/>
    <circle cx="75" cy="115" r="28" fill="#1a1714"/>
    <rect x="20" y="20" width="50" height="14" rx="3" fill="#1f4a3a"/>
    <text x="45" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff">OPEN</text>
    <rect x="40" y="195" width="70" height="18" rx="4" fill="#9b1c1c"/>
    <text x="75" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fff" font-weight="700">1 SLOT</text>
  </g>
  <!-- dryer 2 -->
  <g transform="translate(430,70)">
    <rect width="150" height="230" rx="12" fill="url(#metal)" stroke="#5c564e" stroke-width="3"/>
    <circle cx="75" cy="115" r="58" fill="#2a2622" stroke="#8a8074" stroke-width="8"/>
    <circle cx="75" cy="115" r="42" fill="#4a3a28"/>
    <circle cx="75" cy="115" r="18" fill="none" stroke="#c45c26" stroke-width="6" stroke-dasharray="20 12"/>
    <rect x="20" y="20" width="70" height="14" rx="3" fill="#8a5a12"/>
    <text x="55" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff">RUNNING</text>
    <rect x="40" y="195" width="70" height="18" rx="4" fill="#9b1c1c"/>
    <text x="75" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fff" font-weight="700">1 SLOT</text>
  </g>
  <!-- dryer 3 broken -->
  <g transform="translate(610,70)">
    <rect width="150" height="230" rx="12" fill="url(#metal)" stroke="#5c564e" stroke-width="3"/>
    <circle cx="75" cy="115" r="58" fill="#2a2622" stroke="#8a8074" stroke-width="8"/>
    <circle cx="75" cy="115" r="42" fill="#3d3832"/>
    <line x1="55" y1="95" x2="95" y2="135" stroke="#9b1c1c" stroke-width="8" stroke-linecap="round"/>
    <line x1="95" y1="95" x2="55" y2="135" stroke="#9b1c1c" stroke-width="8" stroke-linecap="round"/>
    <rect x="20" y="20" width="70" height="14" rx="3" fill="#9b1c1c"/>
    <text x="55" y="31" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff">BROKEN</text>
    <rect x="28" y="195" width="94" height="18" rx="4" fill="#6e1212"/>
    <text x="75" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">PAUSE / REFUND</text>
  </g>
  <!-- basket -->
  <ellipse cx="210" cy="390" rx="55" ry="18" fill="#8a7355"/>
  <path d="M160 390 Q170 340 210 335 Q250 340 260 390" fill="#c45c26" stroke="#6e3a18" stroke-width="3"/>
  <text x="210" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#fffaf3" font-weight="700">SLOT</text>
  <!-- caption -->
  <text x="400" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#3d3832">One credit - one dryer slot - shared house rules (not a group-chat rumor)</text>
</svg>
