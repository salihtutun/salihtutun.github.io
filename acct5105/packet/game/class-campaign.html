<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ACCT 5105 · Class Campaign</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #14110f;
      --paper: #f3ebe0;
      --card: #fffaf3;
      --muted: #6a6258;
      --accent: #9b1c1c;
      --accent-deep: #6e1212;
      --ok: #1f4a3a;
      --ok-soft: #d7e8df;
      --warn: #8a5a12;
      --warn-soft: #f3e4c4;
      --line: rgba(20, 17, 15, 0.12);
      --shadow: 0 18px 50px rgba(20, 17, 15, 0.14);
      --ava: #c45c26;
      --ben: #2f5d8c;
      --cara: #6b4c9a;
      --team: #1f4a3a;
      --ra: #8a5a12;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(155, 28, 28, 0.16), transparent 55%),
        radial-gradient(900px 500px at 100% 0%, rgba(31, 74, 58, 0.12), transparent 50%),
        linear-gradient(165deg, #efe4d4 0%, var(--paper) 45%, #e7ddd0 100%);
      min-height: 100%;
    }
    .shell {
      max-width: 1120px;
      margin: 0 auto;
      padding: 1rem 1rem 2.5rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    @media (min-width: 980px) {
      .shell { grid-template-columns: 1fr 300px; align-items: start; }
      .topbar, .foot, .cast-bar { grid-column: 1 / -1; }
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; flex-wrap: wrap;
    }
    .brand {
      font-family: Syne, sans-serif; font-weight: 800;
      letter-spacing: -0.03em;
      font-size: clamp(1.1rem, 2.2vw, 1.45rem);
    }
    .brand span { color: var(--accent); }
    .xp {
      font-size: 0.85rem; font-weight: 600;
      background: var(--card); border: 1px solid var(--line);
      border-radius: 999px; padding: 0.45rem 0.85rem;
    }
    .cast-bar {
      display: flex; gap: 0.55rem; overflow-x: auto;
      padding: 0.35rem 0.15rem 0.15rem;
    }
    .cast-card {
      flex: 0 0 auto;
      display: flex; align-items: center; gap: 0.55rem;
      background: var(--card); border: 1px solid var(--line);
      border-radius: 999px; padding: 0.35rem 0.75rem 0.35rem 0.35rem;
      font-size: 0.78rem;
    }
    .cast-card strong { display: block; font-size: 0.82rem; }
    .cast-card span { color: var(--muted); }
    .avatar {
      width: 2.35rem; height: 2.35rem; border-radius: 50%;
      display: grid; place-items: center; flex-shrink: 0;
      color: #fff; font-family: Syne, sans-serif; font-weight: 800; font-size: 0.85rem;
      box-shadow: inset 0 -3px 0 rgba(0,0,0,0.12);
    }
    .avatar.sm { width: 1.7rem; height: 1.7rem; font-size: 0.7rem; }
    .avatar.lg { width: 3.2rem; height: 3.2rem; font-size: 1.05rem; }
    .avatar.ava { background: var(--ava); }
    .avatar.ben { background: var(--ben); }
    .avatar.cara { background: var(--cara); }
    .avatar.team { background: var(--team); }
    .avatar.ra { background: var(--ra); }

    .stage, .passport {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 1.25rem; box-shadow: var(--shadow);
      padding: clamp(1.1rem, 2.5vw, 1.75rem);
      position: relative; overflow: hidden;
    }
    .stage::before {
      content: ""; position: absolute; inset: 0 auto 0 0; width: 7px;
      background: linear-gradient(180deg, var(--accent), var(--ok));
    }
    h1, h2 {
      font-family: Syne, sans-serif; letter-spacing: -0.03em;
      margin: 0 0 0.55rem; line-height: 1.15;
    }
    h1 { font-size: clamp(1.5rem, 3.6vw, 2.25rem); }
    h2 { font-size: clamp(1.15rem, 2.5vw, 1.6rem); }
    .kicker {
      font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--accent); margin-bottom: 0.35rem;
    }
    .lede, .scene {
      color: var(--muted); line-height: 1.55; margin: 0 0 1rem; max-width: 46rem;
    }
    .scene { color: var(--ink); font-size: 1.05rem; }

    .hero-art {
      display: grid; grid-template-columns: 1.15fr 0.85fr; gap: 1rem;
      margin: 0.85rem 0 1.15rem; align-items: stretch;
    }
    @media (max-width: 720px) { .hero-art { grid-template-columns: 1fr; } }
    .hero-art img, .teach-photo img {
      width: 100%; height: 100%; max-height: 220px; object-fit: cover;
      border-radius: 1rem; border: 1px solid var(--line); display: block;
      background: #efe6da;
    }
    .teach-photo {
      margin: 0.85rem 0 1rem;
    }
    .teach-photo img { max-height: 200px; }
    .teach-photo figcaption {
      font-size: 0.78rem; color: var(--muted); margin-top: 0.4rem; line-height: 1.35;
    }
    .comic {
      background: #fff; border: 1px solid var(--line); border-radius: 1rem;
      padding: 0.9rem 1rem; display: grid; gap: 0.65rem;
    }
    .comic-line {
      display: grid; grid-template-columns: auto 1fr; gap: 0.65rem; align-items: start;
    }
    .bubble {
      background: var(--paper); border-radius: 0.85rem; padding: 0.65rem 0.8rem;
      font-size: 0.92rem; line-height: 1.45; position: relative;
    }
    .bubble .who { font-weight: 700; font-size: 0.78rem; color: var(--muted); margin-bottom: 0.2rem; }

    .explain {
      display: grid; gap: 0.55rem; margin: 0.85rem 0 1rem;
    }
    .explain-card {
      border-radius: 0.9rem; padding: 0.75rem 0.9rem; font-size: 0.9rem; line-height: 1.45;
      border: 1px solid var(--line); background: #fff;
    }
    .explain-card .label {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; margin-bottom: 0.25rem;
    }
    .explain-card.easy { background: #fff8ef; }
    .explain-card.easy .label { color: var(--accent); }
    .explain-card.why { background: var(--ok-soft); border-color: rgba(31,74,58,0.2); }
    .explain-card.why .label { color: var(--ok); }
    .explain-card.mix { background: var(--warn-soft); border-color: rgba(138,90,18,0.25); }
    .explain-card.mix .label { color: var(--warn); }

    .story-chip {
      display: inline-block; background: var(--warn-soft); color: var(--warn);
      font-size: 0.82rem; font-weight: 600; padding: 0.35rem 0.7rem;
      border-radius: 999px; margin-bottom: 0.75rem;
    }
    .map { display: grid; gap: 0.65rem; }
    .level-btn {
      text-align: left; border: 1px solid var(--line); background: #fff;
      border-radius: 1rem; padding: 0.85rem 1rem; cursor: pointer;
      display: grid; grid-template-columns: auto auto 1fr auto; gap: 0.7rem;
      align-items: center; font: inherit; color: inherit;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .level-btn:hover:not(:disabled) {
      transform: translateY(-2px); border-color: rgba(155, 28, 28, 0.35);
    }
    .level-btn:disabled { opacity: 0.42; cursor: not-allowed; }
    .level-btn.done { background: var(--ok-soft); border-color: rgba(31, 74, 58, 0.25); }
    .badge {
      width: 2.15rem; height: 2.15rem; border-radius: 0.7rem;
      display: grid; place-items: center;
      font-family: Syne, sans-serif; font-weight: 800;
      background: var(--ink); color: var(--paper);
    }
    .level-btn.done .badge { background: var(--ok); }
    .thumb {
      width: 3.1rem; height: 3.1rem; border-radius: 0.75rem; object-fit: cover;
      border: 1px solid var(--line); background: #efe6da;
    }
    .meta { font-size: 0.8rem; color: var(--muted); margin-top: 0.15rem; }
    .status { font-size: 0.75rem; font-weight: 600; color: var(--muted); }
    .choices { display: grid; gap: 0.6rem; margin-top: 0.75rem; }
    .choice, .tool-btn {
      text-align: left; border: 1px solid var(--line); background: #fff;
      border-radius: 0.9rem; padding: 0.85rem 1rem; cursor: pointer;
      font: inherit; color: inherit; line-height: 1.4;
    }
    .choice:hover, .tool-btn:hover { border-color: rgba(155, 28, 28, 0.4); }
    .choice.correct { background: var(--ok-soft); border-color: rgba(31, 74, 58, 0.4); }
    .choice.wrong { background: #f7e4e0; border-color: rgba(155, 28, 28, 0.35); }
    .choice:disabled { cursor: default; }
    .feedback {
      margin-top: 0.85rem; padding: 0.85rem 1rem; border-radius: 0.9rem;
      line-height: 1.45; display: none;
    }
    .feedback.show { display: block; }
    .feedback.ok { background: var(--ok-soft); color: var(--ok); }
    .feedback.bad { background: #f7e4e0; color: var(--accent-deep); }
    .actions { display: flex; flex-wrap: wrap; gap: 0.55rem; margin-top: 1.15rem; }
    button.primary, button.ghost {
      font: inherit; font-weight: 600; border-radius: 999px;
      padding: 0.65rem 1.1rem; cursor: pointer; border: 1px solid transparent;
    }
    button.primary { background: var(--accent); color: #fff; }
    button.primary:hover { background: var(--accent-deep); }
    button.primary:disabled { opacity: 0.4; cursor: not-allowed; }
    button.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
    button.ghost:hover { background: rgba(20, 17, 15, 0.04); }
    .progress { display: flex; gap: 0.3rem; margin: 0.55rem 0 1rem; }
    .dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: rgba(20, 17, 15, 0.15); }
    .dot.on { background: var(--accent); }
    .dot.done { background: var(--ok); }
    .passport h2 { font-size: 1.05rem; margin-bottom: 0.35rem; }
    .passport .lede { font-size: 0.85rem; margin-bottom: 0.75rem; }
    .pass-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.45rem; }
    .pass-list li {
      font-size: 0.82rem; line-height: 1.35; padding: 0.55rem 0.65rem;
      border-radius: 0.7rem; border: 1px solid var(--line); background: #fff;
      display: grid; grid-template-columns: 1.1rem 1fr; gap: 0.4rem;
    }
    .pass-list li.on { background: var(--ok-soft); border-color: rgba(31, 74, 58, 0.25); }
    .pass-list .m { font-weight: 700; color: var(--muted); }
    .pass-list li.on .m { color: var(--ok); }
    .machine {
      margin-top: 0.75rem; border: 1px solid var(--line); border-radius: 1rem;
      background: #fff; padding: 1rem;
    }
    .machine-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.85rem; }
    @media (max-width: 700px) { .machine-grid { grid-template-columns: 1fr; } }
    .mailboxes { font-variant-numeric: tabular-nums; font-size: 0.92rem; display: grid; gap: 0.4rem; }
    .mailboxes div {
      display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
      padding: 0.4rem 0.55rem; background: var(--paper); border-radius: 0.65rem;
    }
    .mailboxes .who { display: flex; align-items: center; gap: 0.45rem; }
    .tool-row { display: flex; flex-wrap: wrap; gap: 0.45rem; margin-top: 0.65rem; }
    .tool-btn { padding: 0.55rem 0.75rem; font-size: 0.88rem; font-weight: 600; }
    .tool-btn.danger { border-color: rgba(155, 28, 28, 0.35); }
    .tool-btn.okish { border-color: rgba(31, 74, 58, 0.35); }
    .log {
      margin-top: 0.65rem; font-size: 0.82rem; min-height: 2.4rem; color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .log.alarm { color: var(--accent-deep); font-weight: 600; }
    .log.good { color: var(--ok); font-weight: 600; }
    .quest {
      display: grid; gap: 0.4rem; margin: 0.75rem 0; padding: 0.75rem 0.85rem;
      border-radius: 0.85rem; background: var(--warn-soft); color: var(--warn); font-size: 0.9rem;
    }
    .quest strong { color: var(--ink); }
    .quest li.done { text-decoration: line-through; opacity: 0.7; }
    .sliders { display: grid; gap: 0.75rem; margin-top: 0.75rem; }
    .slider-row label {
      display: flex; justify-content: space-between; font-size: 0.88rem; font-weight: 600;
      margin-bottom: 0.25rem;
    }
    input[type="range"] { width: 100%; accent-color: var(--accent); }
    .math-readout {
      margin-top: 0.85rem; padding: 0.85rem 1rem; border-radius: 0.85rem;
      background: #fff; border: 1px solid var(--line);
      font-variant-numeric: tabular-nums; line-height: 1.5;
    }
    .math-readout.fits { background: var(--ok-soft); border-color: rgba(31, 74, 58, 0.3); }
    .math-readout.blow { background: #f7e4e0; border-color: rgba(155, 28, 28, 0.3); }
    .saybox { margin-top: 0.85rem; display: grid; gap: 0.45rem; }
    .saybox textarea {
      width: 100%; min-height: 4.5rem; resize: vertical; border-radius: 0.85rem;
      border: 1px solid var(--line); padding: 0.75rem 0.85rem; font: inherit; background: #fff;
    }
    .next-card {
      margin-top: 1rem; padding: 0.9rem 1rem; border-radius: 0.95rem;
      background: #fff; border: 1px dashed rgba(155, 28, 28, 0.35);
      font-size: 0.92rem; line-height: 1.45;
    }
    .next-card strong { display: block; margin-bottom: 0.25rem; }
    .bowl-viz {
      height: 12px; border-radius: 999px; overflow: hidden; display: flex;
      background: #ddd; margin: 0.75rem 0;
    }
    .bowl-viz .spin { background: var(--accent); }
    .bowl-viz .usd { background: var(--ok); }
    .foot { font-size: 0.78rem; color: var(--muted); text-align: center; }
    .words {
      display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0 0.85rem;
    }
    .words i {
      font-style: normal; font-size: 0.78rem; font-weight: 600;
      background: #fff; border: 1px solid var(--line); border-radius: 999px;
      padding: 0.28rem 0.6rem; color: var(--muted);
    }
    .ra-tip {
      display: grid; grid-template-columns: auto 1fr; gap: 0.7rem; align-items: start;
      margin: 0.85rem 0 1rem; padding: 0.85rem 1rem; border-radius: 1rem;
      background: linear-gradient(135deg, #f7ead0, #f3e4c4);
      border: 1px solid rgba(138, 90, 18, 0.28);
      animation: tipIn 0.45s ease;
    }
    .ra-tip .label {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.07em;
      text-transform: uppercase; color: var(--ra); margin-bottom: 0.2rem;
    }
    .ra-tip .line { font-size: 0.95rem; line-height: 1.45; color: var(--ink); }
    .ra-tip .line em { font-style: normal; font-weight: 700; color: var(--accent-deep); }
    .hero-svg {
      width: 100%; border-radius: 1rem; border: 1px solid var(--line);
      background: #e8dcc8; display: block; max-height: 280px; object-fit: cover;
    }
    @keyframes tipIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <div class="brand">ACCT 5105 · <span>Class Campaign</span></div>
      <div class="xp" id="xpPill">XP 0</div>
    </div>
    <div class="cast-bar" id="castBar" aria-label="Characters"></div>
    <main class="stage" id="stage"></main>
    <aside class="passport" id="passport"></aside>
    <p class="foot">ACCT 5105 Class Campaign · testnet story only · no seeds · no mainnet · flight sim before Remix</p>
  </div>

  <script>
    const STORAGE_KEY = "acct5105-class-campaign-v3";
    const ASSET = "assets/";

    const CAST = [
      { id: "ava", name: "Ava", role: "classmate · holds SLOT", cls: "ava", letter: "A" },
      { id: "ben", name: "Ben", role: "classmate · trades often", cls: "ben", letter: "B" },
      { id: "cara", name: "Cara", role: "stranger holder later", cls: "cara", letter: "C" },
      { id: "team", name: "Team", role: "minter / pauser (banker)", cls: "team", letter: "T" },
      { id: "ra", name: "RA", role: "floor desk · redemption", cls: "ra", letter: "R" },
    ];

    const PASSPORT_FIELDS = [
      { id: "keys", label: "Seed vs address locked in" },
      { id: "network", label: "Sepolia / no mainnet rule" },
      { id: "alarms", label: "Mint · cap · pause alarms lived" },
      { id: "capmath", label: "Cap math fits before Deploy" },
      { id: "live", label: "Registry + failed-tx honesty" },
      { id: "bowl", label: "Thin-bowl price intuition" },
      { id: "boss", label: "Final Project north star named" },
    ];

    const LEVELS = [
      {
        id: "keys",
        title: "Locker number vs house key",
        meta: "Module 1 · MetaMask",
        xp: 15,
        thumb: "fig-keys.jpg",
        next: "Tonight: Setup Step 1 — copy your 0x from MetaMask (never the seed).",
        type: "quiz",
        words: ["address = locker number", "seed = house key", "wallet ticket"],
        steps: [
          {
            title: "Someone asks for your seed",
            scene: "Group chat on the floor: “Paste your recovery phrase so we can fix MetaMask.” Ava looks unsure.",
            photo: "fig-keys.jpg",
            photoCap: "Course picture: keys and custody. Public locker number ≠ secret house key.",
            easy: "Address (0x…) is safe to share on the roster. The seed phrase is never shared.",
            why: "Module 1: whoever has the seed can empty the locker. Final Project needs a real wallet ticket, not a leaked key.",
            mix: "“Helpful classmate” is still not allowed to hold your seed.",
            cast: ["ava", "team"],
            choices: [
              { text: "Paste the seed — they offered to help.", wrong: "Never. Seed = house key. Anyone with it empties the locker." },
              { text: "Share only my 0x address.", correct: "Yes. Address = locker number (public). Seed stays secret forever." },
              { text: "Send a screenshot that shows the seed words.", wrong: "A photo of the key is still the key. Keep seeds off screen, chat, and PDF." },
            ],
          },
          {
            title: "Which ticket is MetaMask?",
            scene: "Three tickets to the same concert. Only one lets Team sign Deploy in Remix.",
            photo: "fig-three-tickets.jpg",
            photoCap: "Course picture: wallet vs ETF vs exchange tab — same story, different objects.",

            cast: ["team", "ben"],
            choices: [
              { text: "ETF share — a fund holds the key.", wrong: "Useful in markets class; not the key we sign with tonight." },

              { text: "Wallet (MetaMask) — we hold the key.", correct: "Correct. That is the ticket Remix needs." },

          },
        ],
      },
      {
        id: "network",
        title: "Wrong country on the envelope",

        next: "Canvas Module 3 → faucet link, then confirm MetaMask shows Sepolia.",

        words: ["Sepolia = play chain", "gas = stamps", "no mainnet"],
        steps: [
          {
            title: "Network check",

              { text: "Invent a contract address so A3 looks done.", wrong: "No invented addresses. Honest fail stories beat fake proofs." },

          },
          {

          },
        ],
      },
      {
        id: "alarms",
        title: "Three alarms on the machine",

        xp: 25,
        thumb: "fig-two-updates.jpg",

        easy: "A smart contract is a vending machine: same bad input → same reject.",
        why: "You practice the alarms in Python before MetaMask pop-ups cost gas.",
        mix: "“Smart” does not mean wise. It only does the if-then you posted.",

        photoCap: "Transfer = two mailbox updates. Pause freezes those moves.",
      },
      {
        id: "capmath",
        title: "Yearbook stickers must fit",
        meta: "Session 6 · cap math sliders",
        xp: 20,
        thumb: "fig-get-coins.jpg",
        next: "Canvas → S6 Create and airdrop (Colab). Plug your A2 numbers before Remix.",
        type: "sliders",

    function wireChoices(root, step, onContinue) {
      const choices = root.querySelector("#choices");
      const feedback = root.querySelector("#feedback");
      const nextBtn = root.querySelector("#nextBtn");
      let answered = false;
      step.choices.forEach((c) => {
        const b = el(`<button class="choice" type="button">${c.text}</button>`);
        b.addEventListener("click", () => {
          if (answered) return;
          answered = true;
          [...choices.children].forEach((n) => (n.disabled = true));
          if (c.correct) {
            b.classList.add("correct");
            feedback.className = "feedback show ok";
            feedback.textContent = c.correct;
            nextBtn.disabled = false;
          } else {
            b.classList.add("wrong");
            feedback.className = "feedback show bad";
            feedback.textContent = c.wrong + " Try another.";
            setTimeout(() => {
              answered = false;
              [...choices.children].forEach((n) => { n.disabled = false; n.classList.remove("wrong"); });
              feedback.className = "feedback";
            }, 1200);
          }
        });
        choices.appendChild(b);
      });
      nextBtn.addEventListener("click", onContinue);
    }

    function makeCoin() {
      return {
        cap: 10000, minter: "team", pauser: "team", paused: false,
        balances: { Ava: 0, Ben: 0, Cara: 0 }, supply: 0,
        mint(caller, to, amount) {
          if (caller !== this.minter) throw new Error("only the banker prints");
          if (this.supply + amount > this.cap) throw new Error("box lid -- cap");
          this.balances[to] = (this.balances[to] || 0) + amount;
          this.supply += amount;
          return `mint ${amount} → ${to} · supply ${this.supply}`;
        },
        transfer(caller, to, amount) {
          if (this.paused) throw new Error("frozen");
          if ((this.balances[caller] || 0) < amount) throw new Error("broke");
          this.balances[caller] -= amount;
          this.balances[to] = (this.balances[to] || 0) + amount;
          return `${caller} → ${to} · ${amount}`;
        },
        pause(caller, value) {
          if (caller !== this.pauser) throw new Error("not the freeze person");
          this.paused = value;
          return value ? "freeze ON" : "freeze OFF";
        },
      };
    }

      const nextBtn = root.querySelector("#nextBtn");
      const specs = [
        { key: "n", label: "Roster N (Ava, Ben, Cara…)", min: 2, max: 40, step: 1 },
        { key: "airdrop", label: "Airdrop each (gift)", min: 0, max: 1000, step: 25 },
        { key: "pool", label: "Pool reserve (bowl)", min: 0, max: 8000, step: 100 },
        { key: "treasury", label: "Treasury (promises)", min: 0, max: 8000, step: 100 },
        { key: "cap", label: "Cap / Remix Premint", min: 1000, max: 20000, step: 500 },
      ];
      specs.forEach((s) => {
        sliders.appendChild(el(`<div class="slider-row">
          <label><span>${s.label}</span><span id="v-${s.key}">${vals[s.key]}</span></label>
          <input type="range" min="${s.min}" max="${s.max}" step="${s.step}" value="${vals[s.key]}" data-key="${s.key}" />
        </div>`));
      });
      function paint() {
        const planned = vals.airdrop * vals.n + vals.pool + vals.treasury;
        const fits = planned <= vals.cap;
        specs.forEach((s) => { root.querySelector(`#v-${s.key}`).textContent = vals[s.key].toLocaleString(); });
        readout.className = "math-readout " + (fits ? "fits" : "blow");
        readout.innerHTML = `<strong>planned</strong> = ${vals.airdrop} × ${vals.n} + ${vals.pool} + ${vals.treasury}
          = <strong>${planned.toLocaleString()}</strong><br/>
          <strong>cap</strong> = ${vals.cap.toLocaleString()} ·
          ${fits ? "FITS — say these numbers out loud before Deploy." : "OVER LID — cut airdrop or pool. Do not secretly raise the lid."}`;
        nextBtn.disabled = !fits;
      }
      sliders.querySelectorAll("input").forEach((input) => {
        input.addEventListener("input", () => { vals[input.dataset.key] = Number(input.value); paint(); });
      });
      paint();
      root.querySelector("#backMap").addEventListener("click", renderHome);
      nextBtn.addEventListener("click", () => clearLevel(index));
    }

    function renderBowl(index) {
      const level = LEVELS[index];
      let spin = 2000, usd = 1000, moved = false;
      const stage = document.getElementById("stage");
      stage.innerHTML = "";
      const root = el(`<div>
        ${storyChip()}
        <div class="kicker">${level.meta}</div>
        <h2>Thin lemonade bowl</h2>
        ${wordsRow(level.words)}
        ${raTip(RA_TIPS.bowl)}
        <p class="scene">Ben buys 100 SLOT from the class bowl. Cara watches the spot jump — classroom depth, not a housing valuation.</p>
        ${photoBlock(level.photo, level.photoCap)}
        ${explainBlock(level.easy, level.why, level.mix)}
        <div class="machine">
          <div class="meta" style="display:flex;gap:0.5rem;align-items:center;margin-bottom:0.45rem">
            ${avatar("ben", "sm")} buys · ${avatar("cara", "sm")} watches quote
          </div>
          <div class="mailboxes">
            <div><span>SLOT in bowl</span><strong id="spinAmt">${spin}</strong></div>
            <div><span>CLASSUSD in bowl</span><strong id="usdAmt">${usd}</strong></div>
            <div><span>Spot (CLASSUSD / SLOT)</span><strong id="spot">—</strong></div>
          </div>
          <div class="bowl-viz"><div class="spin" id="spinBar"></div><div class="usd" id="usdBar"></div></div>
          <div class="tool-row">
            <button class="tool-btn" type="button" id="buy">Ben buys 100 SLOT</button>
            <button class="tool-btn" type="button" id="resetBowl">Reset bowl</button>
          </div>
          <div class="log" id="log">Spot starts near 0.50. One classroom trade moves it.</div>
        </div>
        <div class="actions">
          <button class="ghost" type="button" id="backMap">Map</button>
          <button class="primary" type="button" id="nextBtn" disabled>I saw the quote move — clear</button>
        </div>
        ${nextCard(level)}
      </div>`);
      stage.appendChild(root);
      const nextBtn = root.querySelector("#nextBtn");
      function paint(msg) {
        const spot = usd / spin;
        root.querySelector("#spinAmt").textContent = spin.toFixed(2);
        root.querySelector("#usdAmt").textContent = usd.toFixed(2);
        root.querySelector("#spot").textContent = spot.toFixed(4);
        const total = spin + usd;
        root.querySelector("#spinBar").style.width = (100 * spin / total) + "%";
        root.querySelector("#usdBar").style.width = (100 * usd / total) + "%";
        if (msg) { const log = root.querySelector("#log"); log.className = "log good"; log.textContent = msg; }
        nextBtn.disabled = !moved;
      }
      root.querySelector("#buy").addEventListener("click", () => {
        const k = spin * usd; const buy = 100;
        if (buy >= spin - 1) return;
        const newSpin = spin - buy; const newUsd = k / newSpin;
        const spent = newUsd - usd; const oldSpot = usd / spin;
        spin = newSpin; usd = newUsd; moved = true;
        paint(`Ben spent ~${spent.toFixed(2)} CLASSUSD. Spot ${oldSpot.toFixed(4)} → ${(usd / spin).toFixed(4)}. Thin book moves fast.`);
      });
      root.querySelector("#resetBowl").addEventListener("click", () => {
        spin = 2000; usd = 1000; moved = false; paint("Bowl reset.");
        root.querySelector("#log").className = "log";
      });
      paint();
      root.querySelector("#backMap").addEventListener("click", renderHome);
      nextBtn.addEventListener("click", () => clearLevel(index));
    }

    function renderSay(index) {
      const level = LEVELS[index];
      const stage = document.getElementById("stage");
      stage.innerHTML = "";
      const root = el(`<div>
        ${storyChip()}
        <div class="kicker">${level.meta}</div>
        <h2>Say what you will vouch</h2>
        ${wordsRow(level.words)}
        ${raTip(RA_TIPS.boss)}
        <p class="scene">Dec 14: memo at 6:15, then live proofs. Type one sentence an assurer would accept.</p>
        ${photoBlock(level.photo, level.photoCap)}
        ${explainBlock(level.easy, level.why, level.mix)}
        <div class="comic" style="margin-bottom:0.85rem">
          <div class="comic-line">${avatar("ra")}<div class="bubble"><div class="who">RA (cold question)</div>“Point to the stranger holder. How do we know they are not on your team?”</div></div>
        </div>
        <div class="saybox">
          <label for="say"><strong>Your sentence</strong> — use evidence words</label>
          <textarea id="say" placeholder="e.g. We vouch our Sepolia registry address, Cara holding a gift balance, the bowl quote, and one kill number — not a slogan deck.">${state.say || ""}</textarea>
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="actions">
          <button class="ghost" type="button" id="backMap">Map</button>
          <button class="primary" type="button" id="nextBtn">Save + clear level</button>
        </div>
        ${nextCard(level)}
      </div>`);
      stage.appendChild(root);
      const feedback = root.querySelector("#feedback");
      root.querySelector("#backMap").addEventListener("click", renderHome);
      root.querySelector("#nextBtn").addEventListener("click", () => {
        const text = root.querySelector("#say").value.trim();
        if (text.length < 24) {
          feedback.className = "feedback show bad";
          feedback.textContent = "Write a real sentence with evidence words.";
          return;
        }
        const lower = text.toLowerCase();
        const ok = ["address", "registry", "holder", "balance", "quote", "pool", "kill", "passport", "explorer", "sep"]
          .some((w) => lower.includes(w));
        if (!ok) {
          feedback.className = "feedback show bad";
          feedback.textContent = "Name evidence (address / holder / quote / kill / passport).";
          return;
        }
        state.say = text;
        saveState();
        clearLevel(index);
      });
    }

    renderCastBar();
    renderPassport();
    renderHome();
  </script>
</body>
</html>
